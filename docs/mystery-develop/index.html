<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="高尾のまちを歩いて、宇宙から届いた謎を解く位置情報連動ゲーム">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./styles/app.css">
  <title>MIRA SIGNAL｜高尾星間通信</title>
</head>
<body>
  <a class="skip-link" href="#screen">メイン画面へ移動</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span aria-hidden="true">✦</span><span>MIRA SIGNAL</span></div>
      <div class="header-actions">
        <button id="conversation-button" class="icon-button" type="button" disabled>会話を振り返る</button>
        <button id="status-button" class="icon-button" type="button" aria-label="進行状況を表示。回収パーツ 0/4">PARTS 0/4</button>
      </div>
    </header>
    <div id="call-island" class="call-island-wrap" role="group" aria-label="ミラとの通話" hidden>
      <div class="call-island">
        <span class="call-avatar" aria-hidden="true">✦</span>
        <div class="call-details"><strong>ミラ</strong><time id="call-duration" aria-label="通話時間">00:00</time></div>
        <div class="call-controls">
          <button id="call-toggle" class="call-icon-button" type="button" aria-label="再生を一時停止" title="一時停止" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path class="call-pause-shape" d="M6 4h4v16H6zm8 0h4v16h-4z"/><path class="call-play-shape" d="M6 3.8v16.4L20 12z"/></svg></button>
          <button id="call-rewind" class="call-icon-button" type="button" aria-label="10秒戻す" title="10秒戻す" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v6h6"/><path d="M4.8 11a7.5 7.5 0 1 1 .3 4.1"/><text x="12" y="16" text-anchor="middle">10</text></svg></button>
          <button id="call-restart" class="call-icon-button" type="button" aria-label="最初から再生" title="最初から再生" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v6h6"/><path d="M4.8 11a7.5 7.5 0 1 1 .3 4.1"/><path d="m10 9 5 3-5 3z" class="call-restart-play"/></svg></button>
        </div>
      </div>
    </div>
    <div id="offline-banner" class="banner" hidden>オフラインです。保存済み素材で進行できます。</div>
    <main id="screen" tabindex="-1" aria-busy="true">
      <section class="loading-screen" aria-labelledby="loading-title">
        <div class="orbit-loader" aria-hidden="true"><span></span></div>
        <p class="eyebrow">CONNECTING</p>
        <h1 id="loading-title">星間通信端末を起動中</h1>
        <p id="loading-detail">公開設定を確認しています…</p>
        <progress id="loading-progress" max="100" value="0">0%</progress>
      </section>
    </main>
    <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
    <div id="dialog-root"></div>
  </div>
  <noscript>このゲームを進めるにはJavaScriptを有効にしてください。</noscript>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
