<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="高尾のまちを歩いて、宇宙から届いた謎を解く位置情報連動ゲーム">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="./styles/app.css">
  <title>MIRA SIGNAL｜高尾星間通信</title>
</head>
<body>
  <a class="skip-link" href="#screen">メイン画面へ移動</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span aria-hidden="true">✦</span><span>MIRA SIGNAL</span></div>
      <button id="status-button" class="icon-button" type="button" aria-label="進行状況を表示。回収パーツ ?/?/?/?">?/?/?/?</button>
    </header>
    <div id="offline-banner" class="banner" hidden>オフラインです。保存済み素材で進行できます。</div>
    <main id="screen" tabindex="-1" aria-busy="true">
      <section class="loading-screen" aria-labelledby="loading-title">
        <div class="orbit-loader" aria-hidden="true"><span></span></div>
        <p class="eyebrow">CONNECTING</p>
        <h1 id="loading-title">星間通信端末を起動中</h1>
        <p id="loading-detail">公開設定を確認しています…</p>
        <progress id="loading-progress" max="100" value="0">0%</progress>
      </section>
    </main>
    <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
    <div id="dialog-root"></div>
  </div>
  <noscript>このゲームを進めるにはJavaScriptを有効にしてください。</noscript>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
